[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voybit-payment-gateway"
version = "0.2.0"
description = "Create Voybit hosted checkout sessions or explicit-asset payments and verify webhooks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
