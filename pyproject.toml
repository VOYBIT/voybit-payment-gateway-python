[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voybit-payment-gateway"
version = "0.1.0"
description = "Voybit payment gateway SDK for Python. Create a crypto payment and verify webhook signatures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
